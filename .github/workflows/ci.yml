name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: check (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax and policy check
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Offline demo
        run: npm run demo
      - name: Benchmark plan (no model)
        run: npm run bench:plan
